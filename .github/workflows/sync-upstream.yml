name: Sync Upstream

# Keeps this fork current with posit-dev/skills.
#
# Runs weekly (and on demand). When upstream/main has commits this fork does not,
# it merges them into a `sync-upstream` branch and opens a pull request. If the
# merge conflicts, it opens an issue instead so the merge can be done by hand.
#
# Note: GitHub disables scheduled workflows on forks by default. Enable Actions
# on this repository (Actions tab -> "I understand my workflows, go ahead and
# enable them") or the schedule below will never fire.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  UPSTREAM_REPO: https://github.com/posit-dev/skills.git
  UPSTREAM_BRANCH: main
  SYNC_BRANCH: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"

      - name: Check for new upstream commits
        id: check
        run: |
          behind=$(git rev-list --count "HEAD..upstream/${UPSTREAM_BRANCH}")
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          if [ "$behind" -eq 0 ]; then
            echo "Already up to date with upstream."
          else
            echo "$behind new upstream commit(s) to merge."
            git log --oneline "HEAD..upstream/${UPSTREAM_BRANCH}" | head -40
          fi

      - name: Merge upstream into sync branch
        id: merge
        if: steps.check.outputs.behind != '0'
        run: |
          git checkout -B "$SYNC_BRANCH"
          if git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U | tee conflicts.txt
            git merge --abort
          fi

      - name: Push and open pull request
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.conflict == 'false'
        # GH_REPO pins gh to this fork. Without it, gh resolves the default
        # repository of a fork checkout to the *parent* (posit-dev/skills), so
        # `gh pr list` finds nothing here and `gh pr create` tries to open the
        # PR upstream, where the token has no rights ("Resource not accessible
        # by integration"). VENDOR_PR_TOKEN (a fine-grained PAT) is an optional
        # fallback if "Allow GitHub Actions to create and approve pull requests"
        # is ever turned off for this repository.
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.VENDOR_PR_TOKEN || github.token }}
        run: |
          git push --force-with-lease -u origin "$SYNC_BRANCH"
          existing=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Updated existing PR #$existing"
          else
            gh pr create \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore: sync ${{ steps.check.outputs.behind }} commit(s) from posit-dev/skills" \
              --body "$(printf 'Automated sync of upstream changes from [posit-dev/skills](https://github.com/posit-dev/skills).\n\nMerged cleanly, so no local skills were touched. Review the diff before merging.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n')"
          fi

      - name: Open issue on conflict
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.conflict == 'true'
        # GH_REPO pins gh to this fork. Without it, gh resolves the default
        # repository of a fork checkout to the *parent* (posit-dev/skills), so
        # `gh pr list` finds nothing here and `gh pr create` tries to open the
        # PR upstream, where the token has no rights ("Resource not accessible
        # by integration"). VENDOR_PR_TOKEN (a fine-grained PAT) is an optional
        # fallback if "Allow GitHub Actions to create and approve pull requests"
        # is ever turned off for this repository.
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.VENDOR_PR_TOKEN || github.token }}
        run: |
          files=$(cat conflicts.txt)
          if gh issue list --state open --search "Upstream sync conflict in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "Conflict issue already open; skipping."
            exit 0
          fi
          gh issue create \
            --title "Upstream sync conflict" \
            --body "$(printf 'Merging \`upstream/%s\` into \`main\` conflicts and needs a manual merge.\n\nConflicting files:\n\n\`\`\`\n%s\n\`\`\`\n\nTo resolve locally:\n\n\`\`\`bash\ngit fetch upstream %s\ngit checkout -b %s main\ngit merge upstream/%s\n# resolve, then push and open a PR\n\`\`\`\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' "$UPSTREAM_BRANCH" "$files" "$UPSTREAM_BRANCH" "$SYNC_BRANCH" "$UPSTREAM_BRANCH")"
